name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Go Vet
        run: go vet ./...

      - name: Go Lint
        run: GOTOOLCHAIN=go1.27.1 go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.3-0.20260819221539-42a05302e2bb run

      - name: Modernize
        run: |
          go fix ./...
          git diff --exit-code

      - name: Test
        run: go test -race -shuffle=on -count=1 -timeout=5m ./...
